osa, ética e compromisso com a formação contínua, sem reduzir você a diagnósticos ou respostas prontas.`],destaque:`A psicanálise orienta a escuta, não como rótulo, mas como uma forma de acompanhar cada história em sua singularidade.`},Gn={frase:`Muitas vezes você fala... mas não diz.`,texto:`Algumas experiências só começam a ganhar sentido quando encontram um espaço de escuta.`},Kn=[{titulo:`Quando tudo parece urgente`,paragrafos:[`Desacelerar parece difícil mesmo quando você sabe que precisa para, por dentro, é difícil simplesmente permanecer.`],detalhe:`A pressa costuma proteger de alguma coisa. Na escuta clínica, dá para olhar o que aparece quando o ritmo diminui — e o que vinha sendo adiado nesse movimento.`},{titulo:`Quando nada parece suficiente`,paragrafos:[`Você faz, entrega, alcança  e, ainda assim, parece que poderia ter feito mais.`],detalhe:`A autocobrança tem história. Entender de onde ela vem não basta para desfazê-la, mas abre espaço para que ela deixe de ser a única medida do seu valor.`},{titulo:`Quando dizer não se torna difícil`,paragrafos:[`Recusar vira medo de decepcionar, de gerar conflito, de mudar a forma como alguém te vê.`],detalhe:`Limites envolvem culpa, vínculo e a imagem que você sustenta diante do outro. É possível olhar para isso sem transformar o assunto em regra de comportamento.`},{titulo:`Quando uma relação faz você se questionar`,paragrafos:[`Afeto e incômodo ao mesmo tempo: querer ficar e querer distância e nada disso cabe numa direção só.`],detalhe:`A ambivalência não é um defeito do vínculo. Ela costuma dizer algo sobre o que se repete nas relações — e sobre o lugar que você ocupa nelas.`},{titulo:`Quando uma perda muda a forma como você vive`,paragrafos:[`Cada pessoa atravessa uma perda no seu tempo. Não existe maneira única de viver esse processo.`],detalhe:`Luto não segue etapas fixas nem prazo combinado. O acompanhamento sustenta esse tempo, sem pressa de devolver você a uma versão anterior de si.`}],qn=``,Jn={frase:`Você já entendeu muita coisa sobre você. Mas continua vivendo algumas delas.`,texto:`Às vezes, saber de onde vem não é suficiente. Há experiências que só começam a ter outro sentido quando podem ser olhadas com mais cuidado.`,cta:`Entender como funciona a psicoterapia`},Yn={kicker:`Como funciona`,titulo:`Começar uma terapia não precisa ser complicado.`,texto:`Cada processo acontece em um tempo diferente.`,passos:[{titulo:`Escolha um horário`,texto:`Consulte os horários disponíveis e escolha aquele que melhor se encaixa na sua rotina.`},{titulo:`Encontro online, com sigilo`,texto:`Videochamada, no conforto da sua casa — com o mesmo sigilo do consultório.`},{titulo:`Construção do acompanhamento`,texto:`Frequência e direção definidas com você, no seu tempo.`}],suporte:`Se preferir esclarecer alguma dúvida antes de agendar, você também pode entrar em contato.`},Xn={kicker:`Quem vai te acompanhar`,titulo:`A pessoa por trás da escuta.`,subtitulo:`Conheça quem está à frente da direção clínica e dos atendimentos.`,intro:`Escutar alguém exige mais do que presença. Exige estudo contínuo, supervisão, formação e responsabilidade clínica.`,paragrafos:[`Meu trabalho é orientado pela psicanálise e sustentado por formação contínua, supervisão, pesquisa e ética.`],nome:`Thaís de Santis Soto Medrano`,credencial:`Psicóloga · CRP 06/170142 · `,formacao:[`Mestre em Psicologia`,`Especialista em Psicanálise`,`Professora universitária`],cita:{antes:`Escuto cada pessoa `,contorno:`no seu tempo`,depois:`, sem pressa e sem roteiro pronto — para que o que precisa ser dito encontre espaço.`},fotos:[Bn(`quem/thais-1.jpg`),Bn(`quem/thais-2.jpg`),Bn(`quem/thais-3.jpg`),Bn(`quem/thais-4.jpg`)]},Zn={kicker:`Honorários e frequência`,titulo:`A frequência é definida a partir da sua necessidade, não do calendário.`,texto:`A frequência dos encontros é definida de acordo com a necessidade do acompanhamento e combinada com você. Antes de confirmar o atendimento, você terá acesso aos honorários, formas de pagamento e condições de cancelamento e reagendamento.`,cta:`Ver horários disponíveis`,pontos:[{titulo:`Sessão de 50 minutos`,texto:`Psicoterapia individual para adolescentes e adultos, por videochamada.`},{titulo:`\n`,texto:`\n`},{titulo:`Cancelamento e reagendamento`,texto:`Com até 24 horas de antecedência, sem cobrança adicional.`}]},Qn={kicker:`Pesquisa e ciência`,titulo:`Uma escuta que também produz ciência.`,texto:`A prática clínica é sustentada por pesquisa: trabalhos publicados em periódicos e congressos nacionais e internacionais sobre saúde mental, neurodesenvolvimento e tecnologia.`,publicacoes:[{titulo:`TurbeLab Serious Game for Executive Functions in Neurodevelopmental Disorders`,venue:`International Journal of Serious Games`,ano:`2026`,tag:`internacional`,url:`https://journal.seriousgamessociety.org/index.php/IJSG/article/view/1298`},{titulo:`Experiência do Jogo TurbeLab para Estímulo de Funções Executivas em Adolescentes com Transtornos do Neurodesenvolvimento`,venue:`SBGames · Simpósio Brasileiro de Jogos e Entretenimento Digital`,ano:`2025`,tag:`nacional`,url:`https://sol.sbc.org.br/index.php/sbgames/article/view/37511`},{titulo:`Trabalho publicado no V CONBRAED — Congresso Brasileiro de Educação a Distância`,venue:`Revista Multidisciplinar de Educação e Meio Ambiente`,ano:`2025`,tag:`nacional`,url:`https://ime.events/v-conbraed/pdf/52910`}],maisLabel:`Ver as outras publicações`,temas:[`A cura através da palavra: por que falar muda o que sentimos?`,`TDAH e TEA em adolescentes: o que a escuta acrescenta ao diagnóstico?`,`Telas, jogos e saúde mental: aliados ou vilões?`,`Atenção, memória e funções executivas: quando a mente parece não obedecer.`,`Luto e cuidados paliativos: o lugar da psicologia nos momentos-limite.`,`Falar sobre suicídio salva: como acolher sem julgar.`],instagram:{handle:`@psi.thaisdesantis`,url:`https://instagram.com/psi.thaisdesantis`}},$n={kicker:`Dúvidas frequentes`,titulo:`\n`,itens:[{pergunta:`Nunca fiz terapia. Preciso saber falar sobre tudo?`,resposta:`Não. Você não precisa chegar sabendo exatamente o que sente ou como explicar sua história. A terapia também começa onde as palavras ainda estão difíceis de aparecer.`},{pergunta:`Como funciona o atendimento on-line?`,resposta:`Os encontros acontecem por videochamada, em ambiente reservado e com compromisso de sigilo. Antes do início, você recebe todas as orientações necessárias sobre o funcionamento do atendimento.`},{pergunta:`Com que frequência acontecem as sessões?`,resposta:`A frequência é combinada com base na sua demanda clínica — pode ser semanal, quinzenal ou em outra configuração, conforme o acompanhamento avança.`},{pergunta:`Como funcionam os honorários e o pagamento?`,resposta:`O valor da sessão aparece no agendamento, antes de qualquer confirmação, junto da modalidade e da duração do atendimento. O pagamento é feito por Pix ou cartão, e a confirmação do horário acontece em seguida.`},{pergunta:`Posso cancelar ou reagendar?`,resposta:`Sim. Cancelamentos e reagendamentos feitos com até 24 horas de antecedência não geram cobrança adicional. Dentro desse prazo, a sessão é considerada realizada — combinamos juntos qualquer exceção.`},{pergunta:`Preciso escolher uma abordagem psicológica?`,resposta:`Não. O trabalho é orientado pela psicanálise, e isso aparece na forma de escutar — não em um vocabulário técnico que você precise conhecer para começar.`},{pergunta:`E se eu não me identificar com a profissional?`,resposta:`A primeira sessão também serve para isso. Se o encontro não fizer sentido para você, é possível interromper ou pedir indicação de outro profissional, sem constrangimento.`},{pergunta:`A clínica atende plano de saúde?`,resposta:`No momento, os atendimentos são particulares. Quando aplicável, a clínica emite a documentação necessária para que você verifique com o seu plano a possibilidade de reembolso, conforme as regras do seu contrato.`},{pergunta:`Como funciona a primeira sessão?`,resposta:`A primeira sessão é um encontro para conhecer sua demanda, compreender o momento que você está vivendo e iniciar a construção do acompanhamento.`},{pergunta:`Em caso de crise ou risco imediato?`,resposta:`A clínica não funciona como serviço de emergência. Em situações de risco imediato, procure um serviço de urgência da sua região. Para apoio emocional, o CVV atende pelo 188, 24 horas por dia. Depois da urgência devidamente assistida, a clínica pode avaliar a possibilidade de acompanhamento psicoterapêutico.`}]},er=[{label:`Política de Privacidade`,href:`#`},{label:`Termos de Uso`,href:`#`},{label:`Cancelamento e reagendamento`,href:`#`}];function tr(e,t={}){let n={event:e,...t};typeof window<`u`&&(window.dataLayer=window.dataLayer??[],window.dataLayer.push(n))}function nr(){if(typeof window>`u`)return()=>{};let e=[[25,`scroll_25`],[50,`scroll_50`],[75,`scroll_75`],[90,`scroll_90`]],t=new Set,n=()=>{let n=document.documentElement.scrollHeight-window.innerHeight;if(n<=0)return;let r=window.scrollY/n*100;for(let[n,i]of e)r>=n&&!t.has(n)&&(t.add(n),tr(i))};return window.addEventListener(`scroll`,n,{passive:!0}),()=>window.removeEventListener(`scroll`,n)}var rr=s((e=>{var t=Symbol.for(`react.transitional.element`),n=Symbol.for(`react.fragment`);function r(e,n,r){var i=null;if(r!==void 0&&(i=``+r),n.key!==void 0&&(i=``+n.key),`key`in n)for(var a in r={},n)a!==`key`&&(r[a]=n[a]);else r=n;return n=r.ref,{$$typeof:t,type:e,key:i,ref:n===void 0?null:n,props:r}}e.Fragment=n,e.jsx=r,e.jsxs=r})),ir=s(((e,t)=>{t.exports=rr()})),ar=(0,w.createContext)({});function or(e){let t=(0,w.useRef)(null);return t.current===null&&(t.current=e()),t.current}var sr=typeof window<`u`?w.useLayoutEffect:w.useEffect,cr=(0,w.createContext)(null);function lr(e,t){e.indexOf(t)===-1&&e.push(t)}function ur(e,t){let n=e.indexOf(t);n>-1&&e.splice(n,1)}var dr=(e,t,n)=>n>t?t:n<e?e:n,fr={},pr=e=>/^-?(?:\d+(?:\.\d+)?|\.\d+)$/u.test(e);function mr(e){return typeof e==`object`&&!!e}var hr=e=>/^0[^.\s]+$/u.test(e);function gr(e){let t;retu
