om sigilo`,texto:`Videochamada, no conforto da sua casa — com o mesmo sigilo do consultório.`},{titulo:`Construção do acompanhamento`,texto:`Frequência e direção definidas com você, no seu tempo.`}],suporte:`Se preferir esclarecer alguma dúvida antes de agendar, você também pode entrar em contato.`},Yn={kicker:`Quem vai te acompanhar`,titulo:`A pessoa por trás da escuta.`,subtitulo:`Conheça quem está à frente da direção clínica e dos atendimentos.`,intro:`Escutar alguém exige mais do que presença. Exige estudo contínuo, supervisão, formação e responsabilidade clínica.`,paragrafos:[`Meu trabalho é orientado pela psicanálise e sustentado por formação contínua, supervisão, pesquisa e ética.`],nome:`Thaís de Santis Soto Medrano`,credencial:`Psicóloga · CRP 06/170142`,formacao:[`Mestre em Psicologia`,`Especialista em Psicanálise`,`Professora universitária`],cita:{antes:`Escuto cada pessoa `,contorno:`no seu tempo`,depois:`, sem pressa e sem roteiro pronto — para que o que precisa ser dito encontre espaço.`},fotos:[Vn(`quem/thais-1.jpg`),Vn(`quem/thais-2.jpg`),Vn(`quem/thais-3.jpg`),Vn(`quem/thais-4.jpg`)]},Xn={kicker:`Honorários e frequência`,titulo:`A frequência é definida a partir da sua necessidade, não do calendário.`,texto:`A frequência dos encontros é definida de acordo com a necessidade do acompanhamento e combinada com você. Honorários, forma de pagamento e condições de cancelamento e reagendamento são combinados diretamente com a Thaís, pelo WhatsApp.`,cta:`Ver horários disponíveis`,pontos:[{titulo:`Sessão de 50 minutos`,texto:`Psicoterapia individual para adolescentes e adultos, por videochamada.`},{titulo:`Cancelamento e reagendamento`,texto:`Com até 24 horas de antecedência, sem cobrança adicional.`}]},Zn={kicker:`Pesquisa e ciência`,titulo:`Uma escuta que também produz ciência.`,texto:`A prática clínica é sustentada por pesquisa: trabalhos publicados em periódicos e congressos nacionais e internacionais sobre saúde mental, neurodesenvolvimento e tecnologia.`
