project_id = "sdeowbqmwkwseyktyemn"

[functions.save-lead-progress]
verify_jwt = false

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://notechstack.com.br"
additional_redirect_urls = ["https://*.notechstack.com.br", "http://localhost:*/acesso", "http://127.0.0.1:*/acesso"]
jwt_expiry = 3600
enable_signup = false

# MFA TOTP obrigatório para NO_ADMIN (hub-marketing-agentes, C2): o app exige aal2
# em /no/* e a marketing-hub recusa sessão aal1 do NO_ADMIN.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[analytics]
enabled = false

# Per-function config.
[functions.roadmap-checkout]
verify_jwt = false

[functions.pagarme-webhook-no]
verify_jwt = false

[functions.assinatura-auditor]
verify_jwt = false

[functions.assinatura-auditor-webhook]
verify_jwt = false

# Agente fiscal: o checkout confere a sessão no código (auth.getUser); o webhook usa Basic Auth do Pagar.me.
[functions.assinatura-fiscal]
verify_jwt = false

[functions.assinatura-fiscal-webhook]
verify_jwt = false

# Agente fiscal v2 (lote B): "Minha conta" confere a sessão no código (auth.getUser); o ciclo da
# assinatura é chamado pelo pg_cron com x-cron-secret, conferido no banco.
[functions.fiscal-conta]
verify_jwt = false

[functions.assinatura-fiscal-ciclo]
verify_jwt = false

# Agente fiscal v2 (lote A): código por e-mail e cadastro pelo site. fiscal-cadastro confere a sessão
# no código (auth.getUser); a lista de municípios do padrão nacional (lote P) vai embutida no bundle.
[functions.fiscal-acesso]
verify_jwt = false

[functions.fiscal-cadastro]
verify_jwt = false

[functions.skill-01-ativar-dashboard]
verify_jwt = true

[functions.project-convert]
verify_jwt = true

[functions.project-status-transition]
verify_jwt = true

[functions.project-publish-version]
